version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: high_school_pgvector
    environment:
      POSTGRES_DB: knowledge_db
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: always

volumes:
  pgvector_data:
